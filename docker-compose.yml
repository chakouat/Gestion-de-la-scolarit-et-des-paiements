services:
  # 1. Base de données relationnelle MySQL
  database:
    image: mysql:8.0
    container_name: zen_database
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-zen_db}
      MYSQL_USER: ${DB_USERNAME:-zen_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-zen_password}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-zen_root_password}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - zen_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-zen_root_password}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # 2. Backend API Laravel
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: zen_backend
    restart: unless-stopped
    environment:
      APP_NAME: ${APP_NAME:-ZEN}
      APP_ENV: ${APP_ENV:-local}
      APP_KEY: ${APP_KEY:-}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_URL: ${APP_URL:-http://localhost:8000}
      DB_CONNECTION: mysql
      DB_HOST: database
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-zen_db}
      DB_USERNAME: ${DB_USERNAME:-zen_user}
      DB_PASSWORD: ${DB_PASSWORD:-zen_password}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      SANCTUM_STATEFUL_DOMAINS: ${SANCTUM_STATEFUL_DOMAINS:-localhost:5173}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/var/www
      - /var/www/vendor
    depends_on:
      database:
        condition: service_healthy
    networks:
      - zen_network

  # 3. Frontend React (Vite)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: zen_frontend
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api}
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - zen_network

volumes:
  db_data:
    driver: local

networks:
  zen_network:
    driver: bridge
